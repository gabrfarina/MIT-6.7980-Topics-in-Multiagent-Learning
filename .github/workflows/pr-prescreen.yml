name: Course source pre-screen
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Existing open PR to check
        required: true
        type: string
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: course-prescreen-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: tooling
          persist-credentials: false
      - name: Resolve current PR
        id: pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tooling/scripts/pr_checks/resolve.py
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/pull/${{ steps.pr.outputs.pr_number }}/head
          path: proposed
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          echo 'ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true' | sudo debconf-set-selections
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y ttf-mscorefonts-installer poppler-utils
          python -m pip install -r tooling/scripts/visual_preview/requirements.txt
          curl -fsSL https://github.com/typst/typst/releases/download/v0.15.1/typst-x86_64-unknown-linux-musl.tar.xz -o /tmp/typst.tar.xz
          tar -xJf /tmp/typst.tar.xz -C /tmp
          echo /tmp/typst-x86_64-unknown-linux-musl >> "$GITHUB_PATH"
      - name: Check source and integration
        env:
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        run: python tooling/scripts/pr_checks/prescreen.py --checkout proposed --base "$BASE_SHA" --head "$HEAD_SHA" --pr "$PR_NUMBER" --output review
      - name: Save findings and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: course-pr-review
          path: |
            review/report.json
            review/summary.md
            review/*-tests.json
            review/*.log
          retention-days: 14
          if-no-files-found: error

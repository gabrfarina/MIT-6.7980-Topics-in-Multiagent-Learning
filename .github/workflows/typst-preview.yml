name: Typst visual preview
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Existing open PR to compile and preview
        required: true
        type: string
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: typst-preview-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out trusted tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: tooling
          persist-credentials: false
      - name: Resolve current PR revisions
        id: pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tooling/scripts/visual_preview/resolve.py
      - name: Check out proposed notes
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/pull/${{ steps.pr.outputs.pr_number }}/head
          fetch-depth: 0
          path: after
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install fixed rendering tools
        run: |
          python -m pip install -r tooling/scripts/visual_preview/requirements.txt
          curl -fsSL https://github.com/typst/typst/releases/download/v0.15.1/typst-x86_64-unknown-linux-musl.tar.xz -o /tmp/typst.tar.xz
          tar -xJf /tmp/typst.tar.xz -C /tmp
          echo /tmp/typst-x86_64-unknown-linux-musl >> "$GITHUB_PATH"
      - name: Check preview tooling
        run: python -m unittest discover -s tooling/scripts/visual_preview -p 'test_*.py'
      - name: Compare PR against its merge base
        env:
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        run: |
          MERGE_BASE=$(git -C after merge-base "$BASE_SHA" "$HEAD_SHA")
          git -C after worktree add --detach ../before "$MERGE_BASE"
          python tooling/scripts/visual_preview/build.py --before before --after after --base-sha "$MERGE_BASE" --head-sha "$HEAD_SHA" --pr "$PR_NUMBER" --output preview
      - name: Save preview, PDFs, and compiler logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: typst-visual-preview
          path: preview/
          retention-days: 14
          if-no-files-found: error

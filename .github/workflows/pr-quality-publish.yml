name: Publish course PR checks
on:
  workflow_run:
    workflows: [Course source pre-screen, Course HTML review]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Completed source or HTML check to publish
        required: true
        type: string
permissions:
  contents: write
  pull-requests: write
  actions: read
  checks: write
concurrency:
  group: course-check-publisher-${{ github.event.workflow_run.id || inputs.run_id }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.event == 'pull_request' || github.event.workflow_run.event == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==12.3.0
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        continue-on-error: true
        with:
          name: course-pr-review
          path: review
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id || inputs.run_id }}
      - name: Verify provenance and publish bounded report data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/pr_checks/publish.py

name: Publish Typst preview
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Completed Typst preview run to publish again
        required: true
        type: string
  workflow_run:
    workflows: [Typst visual preview]
    types: [completed]
permissions:
  contents: write
  pull-requests: write
  actions: read
# Each PR has its own image branch. Unrelated PRs must not replace one another
# in GitHub's single-pending-run concurrency slot during a history backfill.
concurrency:
  group: typst-preview-publisher-${{ github.event.workflow_run.id || inputs.run_id }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.event == 'pull_request' || github.event.workflow_run.event == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==12.3.0
      - name: Download render data
        continue-on-error: true
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: typst-visual-preview
          path: preview
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id || inputs.run_id }}
      - name: Validate and publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/visual_preview/publish.py
